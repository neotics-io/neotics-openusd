name: Neotics kit
on:
  workflow_dispatch:
  push:
    paths:
      - 'neotics/**'
      - '.github/workflows/neotics.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install usd-core numpy pytest
      - name: Test
        run: python -m pytest -q -s neotics/tests
